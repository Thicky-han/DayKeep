name: 故障报告
description: 报告界面、桌面操作或已交付功能的问题
body:
  - type: input
    id: version
    attributes:
      label: 程序与 Windows 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、实际结果与期望结果
      description: 不要包含专利申请编号、私人缴费数据或本机用户名。
    validations:
      required: true
