name: Windows shell checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Check source and build
        shell: pwsh
        run: |
          ./scripts/check.ps1
          ./scripts/build.ps1
          git diff --check
      # WPF interactive smoke checks run locally; hosted desktop access is not assumed.
